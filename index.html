<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ŞB Kokpit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="https://soforbey.com/static/img/ikon.png">
<link rel="apple-touch-icon" href="https://soforbey.com/static/img/ikon.png">
<title>Şoför Bey Kokpit</title>
<style>
:root{--bg:#0f1115;--kart:#181b22;--kart2:#1f232c;--cizgi:#262a33;--yazi:#e8eaf0;--soluk:#8a90a0;--yesil:#2ecc71;--sari:#f5b041;--turuncu:#ff7a2f;--kirmizi:#ff4757;--mavi:#4da3ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--yazi);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
.kap{max-width:560px;margin:0 auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;margin:calc(4px + env(safe-area-inset-top)) 0 12px}
.logo{width:36px;height:36px;border-radius:10px;flex:none;object-fit:cover;display:block}
header h1{font-size:16px;margin:0}header small{color:var(--soluk);display:block;font-size:12px}
.saat{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;color:var(--soluk);font-size:13px}
.ikonbtn{background:none;border:0;color:var(--soluk);padding:6px;margin-left:4px;font-size:18px}
.serit{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.serit.kirmizi{background:#3a0f15;border:1px solid #6a1c26;color:#ffb3ba}
.serit.sari{background:#3a2a0b;border:1px solid #6b4d12;color:#ffd98a}
.durum{border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--cizgi);background:var(--kart)}
.durum.acil{background:linear-gradient(135deg,#3a0f15,#1d0b0e);border-color:#5a1a22}
.durum.alarm{background:linear-gradient(135deg,#3a1e0b,#1d120a);border-color:#5e3414}
.durum.sakin{background:linear-gradient(135deg,#0d2a1a,#0d1611);border-color:#1b4a2f}
.durum b{font-size:20px;display:block}.durum p{margin:4px 0 12px;color:var(--soluk)}
.durum.acil p{color:#ffb3ba}
.ikili{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;padding:12px;border:0;border-radius:10px;font-weight:700;font-size:15px;color:#fff;background:#2b303b}
.btn.kirmizi{background:var(--kirmizi)}.btn.mavi{background:#2563eb}.btn.yesil{background:#1f9d55}
.btn:disabled{opacity:.5}
.sayilar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sayi{background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;padding:10px;text-align:center}
.sayi b{font-size:24px;display:block;font-variant-numeric:tabular-nums}.sayi span{font-size:11px;color:var(--soluk)}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;padding:12px;margin-bottom:12px}
.kart h2{font-size:12px;margin:0 0 6px;color:var(--soluk);text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between;gap:8px}
.satir{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--cizgi)}
.satir:first-of-type{border-top:0}
.satir .ad{flex:1;min-width:0}.satir .ad small{color:var(--soluk);display:block;font-size:12px}
.oneri{color:#9ecbff;font-size:12px;margin-top:3px}
.cubuk{height:6px;background:#2a2e38;border-radius:4px;overflow:hidden;margin-top:6px}.cubuk i{display:block;height:100%}
.rozet{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.r-acil{background:#ff47572a;color:var(--kirmizi)}.r-alarm{background:#ff7a2f2a;color:var(--turuncu)}.r-uyari{background:#f5b0412a;color:var(--sari)}.r-ok{background:#2ecc712a;color:var(--yesil)}.r-gri{background:#ffffff14;color:var(--soluk)}
.atabtn{white-space:nowrap;border:0;border-radius:9px;padding:8px 12px;background:#2563eb;color:#fff;font-weight:700;font-size:13px;flex:none}
.soluk{opacity:.45}
.tikla{cursor:pointer}
.basv-ust{font-size:14px;margin-top:2px}
/* Alt menü (uygulama gibi) */
.kap{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.altmenu{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:center;gap:2px;background:rgba(15,17,21,.97);border-top:1px solid var(--cizgi);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.altmenu button{flex:1;max-width:112px;background:none;border:0;color:var(--soluk);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border-radius:10px}
.altmenu button.on{color:var(--yazi);background:#1f232c}
.am-ik{position:relative;font-size:20px;line-height:1.1}
.am-ik em{position:absolute;top:-4px;right:-12px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--kirmizi);color:#fff;font-size:10px;font-style:normal;font-weight:800;display:grid;place-items:center}
/* Görsel düzen: daha ferah kartlar, belirgin başlıklar */
.kart{border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
.kart h2{font-size:12px;margin-bottom:8px;font-weight:700}
.sayi{border-radius:14px;padding:12px 8px}
.sayi b{font-size:26px}
.btn{border-radius:12px;transition:opacity .15s}
.btn:active,.atabtn:active{opacity:.75}
.atabtn{border-radius:10px;padding:9px 14px}
.durum{border-radius:16px}
.durum b{font-size:19px;line-height:1.3}
header h1{font-size:17px}
#harita{height:calc(100vh - 300px);min-height:300px;border-radius:10px;overflow:hidden;background:#1b1f27}
.leaflet-container{font:inherit}
.leaflet-popup-content{margin:10px 12px;font-size:13px;color:#111}
.hr-lejant{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--soluk);margin-top:6px}
.hr-lejant i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.sohbet{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px;max-height:38vh;overflow:auto}
.balon{max-width:85%;padding:8px 10px;border-radius:12px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.balon small{display:block;font-size:11px;color:var(--soluk);margin-top:3px}
.balon.o{background:var(--kart);border:1px solid var(--cizgi);align-self:flex-start}
.balon.biz{background:#16233d;border:1px solid #2563eb;align-self:flex-end}
textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;font-size:15px;resize:vertical}
.kr-grafik{display:flex;align-items:flex-end;gap:3px;height:80px;margin:6px 0 2px}
.kr-sut{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.kr-sut i{display:block;width:100%;min-height:2px;border-radius:3px 3px 0 0}
.kr-sut span{font-size:10px;color:var(--soluk);height:12px}
.basv-gun{font-size:11px;color:var(--soluk);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 2px}
.tik{width:30px;height:30px;flex:none;border-radius:9px;border:2px solid #3a404d;background:transparent;color:#fff;font-size:17px;font-weight:800;display:grid;place-items:center;padding:0}
.tik.on{background:var(--yesil);border-color:var(--yesil)}
.basv-tamam .ad{opacity:.55}
a.satir.yap{color:var(--yazi);text-decoration:none}
a.satir.yap .ok{color:var(--soluk);font-size:20px}
.bos{color:var(--soluk);font-size:14px;padding:6px 0}
.sf{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--cizgi)}.sf:first-of-type{border-top:0}
.nokta{width:9px;height:9px;border-radius:50%;flex:none}
.sf .ad{flex:1;min-width:0}.sf small{color:var(--soluk);font-size:12px;display:block}
a.tel{color:var(--mavi);text-decoration:none;font-size:13px}
.kom{font-size:13px;padding:6px 0;border-top:1px solid var(--cizgi);color:var(--soluk)}.kom:first-of-type{border-top:0}
.kom b{color:var(--yazi);font-weight:600}
/* giriş */
.giris{max-width:380px;margin:12vh auto 0;padding:0 16px}
.giris .logo{width:64px;height:64px;border-radius:14px;margin:0 auto 14px}
.giris h1{text-align:center;font-size:20px;margin:0 0 4px}.giris p{text-align:center;color:var(--soluk);margin:0 0 18px;font-size:14px}
input{width:100%;padding:13px 12px;border-radius:10px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;font-size:16px;margin-bottom:10px}
.hata{color:#ff9aa5;font-size:13px;min-height:18px;text-align:center}
/* pencere */
.perde{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.pencere{background:var(--kart2);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.pencere h3{margin:0 0 4px;font-size:17px}.pencere .alt{color:var(--soluk);font-size:13px;margin-bottom:10px}
.secim{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--kart);border:1px solid var(--cizgi);border-radius:10px;padding:10px;margin-bottom:8px;color:var(--yazi)}
.secim.sec{border-color:#2563eb;background:#16233d}
.secim .ad{flex:1}.secim small{display:block;color:var(--soluk);font-size:12px}
.bildirim{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2b303b;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;z-index:10;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none}
.bildirim.goster{opacity:1}
.etiket{position:fixed;top:8px;right:8px;background:var(--sari);color:#111;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;z-index:5}
</style>
</head>
<body>
<div id="uygulama" class="kap"></div>
<div id="bildirim" class="bildirim"></div>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=20261119"></script>
<script src="app.js?v=20261119b"></script>
</body>
</html>
